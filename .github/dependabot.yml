version: 2
updates:
  # Unified npm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # One PR/month for all minor + patch bumps. Majors stay separate so
      # breaking changes are reviewed individually.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # changesets/action v2 requires Changesets CLI v3; the workspace is on v2.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
