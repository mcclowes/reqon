name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build vague dependency once and cache it
  build-vague:
    name: Build Vague Dependency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vague
        uses: actions/checkout@v7
        with:
          repository: mcclowes/vague
          path: vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vague/package-lock.json

      - name: Cache vague build
        id: cache-vague
        uses: actions/cache@v6
        with:
          path: vague
          key: vague-build-${{ hashFiles('vague/package-lock.json', 'vague/src/**', 'vague/tsconfig.json') }}

      - name: Install and build vague
        if: steps.cache-vague.outputs.cache-hit != 'true'
        run: |
          cd vague
          npm ci
          npm run build

      - name: Upload vague artifact
        uses: actions/upload-artifact@v7
        with:
          name: vague-build
          path: vague
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build-vague

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Install ran with --ignore-scripts (security), which skips better-sqlite3's
      # prebuild-install postinstall. Rebuild just that one trusted optional dep so
      # the SQLite execution-log backend is exercised by the suite.
      - name: Build better-sqlite3 native binding
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build-vague

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build better-sqlite3 native binding
        run: npm rebuild better-sqlite3

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          verbose: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: build-vague

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (incl. tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build-vague

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run security audit
        # Gate on critical vulnerabilities in production dependencies only.
        # Dev tooling (vitest/vite/rollup/esbuild) and transitive high-severity
        # advisories are tracked/bumped via Dependabot rather than blocking every
        # merge on an always-red check.
        run: npm audit --omit=dev --audit-level=critical

  crash-injection:
    name: Crash injection
    runs-on: ubuntu-latest
    needs: build-vague

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The durability proof: run a mission, model a crash at every event
      # boundary (and a torn mid-write), resume, and assert no lost record and
      # no duplicated effect. A dedicated, visible gate — durability is a trust
      # claim and must stay green.
      - name: Run crash-injection suite
        run: npm run test:crash

  postgres-adapter:
    name: Postgres adapter
    runs-on: ubuntu-latest
    needs: build-vague

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqon
          POSTGRES_PASSWORD: reqon
          POSTGRES_DB: reqon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      # pg is pure JS, so --ignore-scripts leaves it fully functional.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Postgres execution-log contract tests
        run: npm run test:pg
        env:
          DATABASE_URL: postgres://reqon:reqon@localhost:5432/reqon_test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Download vague build
        uses: actions/download-artifact@v8
        with:
          name: vague-build
          path: ../vague

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run benchmarks
        run: npm run bench

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore
