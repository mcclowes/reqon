name: Publish VS Code extension

# Changesets versions and tags the extension but marks it private so npm never
# sees it. Its package tag hands publishing to the VS Code Marketplace workflow.
on:
  push:
    tags:
      - 'reqon-lang@*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # This is a grammar-only extension with no dependencies or build step.
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies
        working-directory: packages/reqon-lang
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
