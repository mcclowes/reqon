name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The secure install skips better-sqlite3's native build. Rebuild only
      # that trusted optional dependency so the release suite exercises SQLite.
      - name: Build better-sqlite3 native binding
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm run test:run

      - name: Build npm package
        run: npm run build

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: Release packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
