name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout reqon
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Install ran with --ignore-scripts (security), which skips better-sqlite3's
      # prebuild-install postinstall. Rebuild just that one trusted optional dep so
      # the SQLite execution-log backend is exercised by the suite. The rebuild only
      # works because package.json allows better-sqlite3 under allowScripts: npm 12
      # (installed above for OIDC) blocks unapproved install scripts outright, where
      # the bundled npm only warns.
      - name: Build better-sqlite3 native binding
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Validate changelog
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if ! grep -q "## $TAG_VERSION" docusaurus/docs/changelog.md; then
            echo "Error: docusaurus/docs/changelog.md does not contain an entry for version $TAG_VERSION"
            echo "Please add a section: ## $TAG_VERSION"
            exit 1
          fi
          echo "✓ Changelog contains entry for $TAG_VERSION"

      - name: Publish to npm with provenance
        run: |
          if [[ "$GITHUB_REF" == *"-alpha"* ]] || [[ "$GITHUB_REF" == *"-beta"* ]] || [[ "$GITHUB_REF" == *"-rc"* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
